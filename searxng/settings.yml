use_default_settings:
  engines:
    keep_only:
      - bing
      - duckduckgo
      - mojeek
      - qwant
      - startpage
      - wikipedia

# Einige dieser Engines sind im SearXNG-Standard deaktiviert.
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
    inactive: false
  - name: qwant
    disabled: false
  - name: startpage
    disabled: false
    inactive: false
  - name: wikipedia
    display_type:
      - list

general:
  debug: false
  instance_name: OBD2 Klartext Recherche
  contact_url: https://obd2.traders-ai-signals.de/impressum.html

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false
