# Lokale Entwicklung: App + PostgreSQL
#   docker compose up --build
#   http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: obd2
      POSTGRES_USER: obd2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obd2-local}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obd2 -d obd2"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://obd2:${POSTGRES_PASSWORD:-obd2-local}@db:5432/obd2
      MCP_URL: http://mcp:8090/mcp
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_healthy

  mcp:
    build: .
    command: ["node", "mcp/server.js"]
    environment:
      PORT: 8090
      DATABASE_URL: postgres://obd2:${POSTGRES_PASSWORD:-obd2-local}@db:5432/obd2
      SEARXNG_URL: http://search:8080
    expose:
      - "8090"
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_started

  search:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-development-only}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose:
      - "8080"

volumes:
  db-data:
